
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title> Should be me getting brunch 😂 </title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0f0f0f;
  display:flex;
  justify-content:center;
  min-height:100vh;
  color:#fff;
}

.page{
  width:100%;
  max-width:420px;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
}

/* ================= AD ================= */
.ad-top{
  display:flex;
  justify-content:center;
  margin-bottom:10px;
}

/* ================= VIDEO ================= */
.video-wrapper{
  position:relative;
  width:100%;
  height:72vh;
  border-radius:18px;
  overflow:hidden;
  background:#000;
  box-shadow:0 12px 35px rgba(0,0,0,.65);
  cursor:pointer;
}

/* Skeleton Loader */
.video-wrapper.loading::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,#111 25%,#1b1b1b 37%,#111 63%
  );
  background-size:400% 100%;
  animation:shimmer 1.2s infinite;
  z-index:5;
}

@keyframes shimmer{
  0%{background-position:100% 0}
  100%{background-position:-100% 0}
}

/* Gradient Overlay */
.video-wrapper::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.25),
    rgba(0,0,0,0),
    rgba(0,0,0,.35)
  );
  pointer-events:none;
  z-index:2;
}

.video-inner{
  position:relative;
  width:100%;
  height:100%;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:18px;
  transform:translateZ(0);
  backface-visibility:hidden;
}

/* Disable fullscreen button */
video::-webkit-media-controls-fullscreen-button{
  display:none!important;
}

/* ================= UI OVERLAY ================= */
.overlay-ui{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:14px;
  z-index:3;
  pointer-events:none;
}

.caption{
  font-size:15px;
  font-weight:500;
  margin-bottom:8px;
  text-shadow:0 2px 10px rgba(0,0,0,.9);
}

.cta{
  align-self:flex-start;
  font-size:13px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(6px);
  padding:6px 12px;
  border-radius:999px;
  transition:.3s;
}

/* Sound Icon */
.sound-icon{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(0,0,0,.55);
  padding:6px 9px;
  border-radius:50%;
  font-size:14px;
  z-index:4;
}

/* Progress Bar */
.progress-bar{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:3px;
  background:rgba(255,255,255,.18);
  z-index:4;
}
.progress-bar span{
  display:block;
  height:100%;
  width:0%;
  background:#fff;
}

/* Desktop */
@media (min-width:768px){
  .video-wrapper{height:560px}
}
</style>
</head>

<body>

<div class="page">

  <!-- AD -->
  <div class="ad-top">
    <script>
    atOptions={
      'key':'176376f281e0f17f9cde96ca0cb7cd4c',
      'format':'iframe',
      'height':250,
      'width':300,
      'params':{}
    };
    </script>
    <script src="https://beginshello.com/176376f281e0f17f9cde96ca0cb7cd4c/invoke.js"></script>
  </div>

  <!-- VIDEO -->
  <div class="video-wrapper loading" id="videoWrap">
    <div class="video-inner">

      <video id="video"
        autoplay muted loop playsinline webkit-playsinline
        preload="metadata"
        disablePictureInPicture
        controlsList="nodownload noremoteplayback nofullscreen"
        poster="">
        <source src="https://cdn.videy.co/rNqOw2C11.mp4" type="video/mp4">
      </video>

      <div class="sound-icon" id="soundIcon">🔇</div>

      <div class="overlay-ui">
        <div class="caption"> Should be me getting brunch 😂 </div>
        <div class="cta" id="cta">🔊 Tap for sound</div>
      </div>

      <div class="progress-bar"><span></span></div>

    </div>
  </div>

</div>

<script>
const video = document.getElementById("video");
const wrap = document.getElementById("videoWrap");
const bar = document.querySelector(".progress-bar span");
const cta = document.getElementById("cta");
const soundIcon = document.getElementById("soundIcon");

video.play().catch(()=>{});

/* remove loader */
video.addEventListener("canplay",()=>{
  wrap.classList.remove("loading");
});

/* tap to unmute */
video.addEventListener("click",()=>{
  if(video.muted){
    video.muted=false;
    cta.textContent="🔥 Sound on";
    soundIcon.textContent="🔊";
    setTimeout(()=>cta.style.opacity=0,1200);
  }
});

/* progress */
video.addEventListener("timeupdate",()=>{
  bar.style.width=(video.currentTime/video.duration*100)+"%";
});

/* anti fullscreen */
video.addEventListener("webkitbeginfullscreen",e=>e.preventDefault());
document.addEventListener("fullscreenchange",()=>{
  if(document.fullscreenElement){
    document.exitFullscreen();
  }
});
</script>
